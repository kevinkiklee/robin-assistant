<!doctype html>
<html lang="en" data-fake-key="fakeebird123">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ebird fixture</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #111; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #eee; } }
  body { background: var(--bg); color: var(--fg); font: 16px system-ui, sans-serif; margin: 2rem 16px; }
  input { font: 14px ui-monospace, monospace; inline-size: min(36rem, 100%); }
</style>
</head>
<body>
  <h1>ebird key (test fixture)</h1>
  <!-- FAKE test value; never a real secret -->
  <input id="token" readonly value="fakeebird123">
  <button type="button" id="copy-btn" aria-label="Copy key">Copy</button>
  <script>
    document.getElementById('copy-btn').addEventListener('click', async () => {
      await navigator.clipboard.writeText(document.getElementById('token').value);
    });
  </script>
</body>
</html>
